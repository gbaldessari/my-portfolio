<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link id="favicon" rel="icon" type="image/png" href="/assets/icons/icoBlanco.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Desarrollador full stack en La Serena, Chile. Plataformas web para pymes y organizaciones públicas." />
  <meta name="theme-color" content="#0a0f1a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Giacomo Baldessari" />
  <meta property="og:locale" content="es_CL" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Giacomo Baldessari — Desarrollador Full Stack</title>
  <script>
    (function () {
      var stored = localStorage.getItem('portfolio-theme');
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      var favicon = document.getElementById('favicon');
      if (favicon) {
        favicon.href = theme === 'dark' ? '/assets/icons/icoBlanco.png' : '/assets/icons/icoNegro.png';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
